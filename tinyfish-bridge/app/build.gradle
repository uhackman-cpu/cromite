plugins {
    id "com.android.application"
}

android {
    namespace "com.tinyfish.browser"
    compileSdk 35

    defaultConfig {
        applicationId "com.tinyfish.browser"
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}
