name: Build TinyFish Browser APK
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/build-tinyfish-apk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-arm64-apk:
    name: Build and sign TinyFish Browser (Android ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download and verify official Cromite ARM64 base
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://github.com/uazo/cromite/releases/download/v153.0.8010.37-11507ac1061b5ea227806f5e84db5a57df6ccf6a/arm64_ChromePublic.apk' \
            --output arm64_ChromePublic.apk
          echo '9db12af1af021f42b4371e76d0e9fe476a7085bbbbc76bc410a538d028bf6071  arm64_ChromePublic.apk' | sha256sum --check
          echo 'CROMITE_APK_SHA256=9db12af1af021f42b4371e76d0e9fe476a7085bbbbc76bc410a538d028bf6071' >> "$GITHUB_ENV"

      - name: Download and verify Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar' \
            --output apktool.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar' | sha256sum --check

      - name: Build TinyFish automation bridge bytecode
        shell: bash
        run: |
          set -euo pipefail
          gradle -p tinyfish-bridge --no-daemon --stacktrace assembleDebug
          test -s tinyfish-bridge/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode Android package
        shell: bash
        run: java -Xmx8g -jar apktool.jar d -f arm64_ChromePublic.apk -o decoded

      - name: Apply TinyFish app name and package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("decoded")
          manifest = root / "AndroidManifest.xml"
          text = manifest.read_text(encoding="utf-8")
          pkg = re.search(r'<manifest\b[^>]*\bpackage="([^"]+)"', text, re.S)
          if not pkg:
              raise SystemExit("Could not find the manifest package")
          old_package = pkg.group(1)
          new_package = "com.tinyfish.browser"
          if old_package == new_package:
              raise SystemExit("APK already has TinyFish package ID; unexpected base APK")

          text, n = re.subn(
              r'(<manifest\b[^>]*\bpackage=")[^"]+(")',
              r'\g<1>' + new_package + r'\2',
              text, count=1, flags=re.S
          )
          if n != 1:
              raise SystemExit("Could not update package ID")
          app_start = text.find("<application")
          if app_start < 0:
              raise SystemExit("Could not find application element")
          app_end = text.find(">", app_start)
          if app_end < 0:
              raise SystemExit("Could not find end of application element")
          app_tag = text[app_start:app_end + 1]
          label_pattern = r'(?<![\w.-])(?:[A-Za-z_][A-Za-z0-9_.-]*:)?label\s*=\s*"[^"]*"'
          app_tag = re.sub(label_pattern, "", app_tag)
          app_tag = app_tag[:-1].rstrip() + ' android:label="TinyFish Browser">'
          text = text[:app_start] + app_tag + text[app_end + 1:]
          root_start = text.find("<manifest")
          if root_start < 0:
              raise SystemExit("Could not locate manifest root tag")
          root_end = text.find(">", root_start)
          if root_end < 0:
              raise SystemExit("Could not locate manifest root tag end")
          root_tag = text[root_start:root_end]
          if "xmlns:android" not in root_tag:
              insert_at = root_start + len("<manifest")
              text = text[:insert_at] + ' xmlns:android="http://schemas.android.com/apk/res/android"' + text[insert_at:]
          manifest.write_text(text, encoding="utf-8")

          # Update matching literal provider authorities and package constants in
          # decoded text/resources/smali. Binary assets are deliberately untouched.
          text_suffixes = {
              ".xml", ".smali", ".yml", ".yaml", ".txt", ".json",
              ".properties", ".cfg", ".pro", ".mf", ".html", ".js"
          }
          changed = 0
          for path in list(root.rglob("*")):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  value = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if old_package in value:
                  path.write_text(value.replace(old_package, new_package), encoding="utf-8")
                  changed += 1

          # If the package is used as a smali namespace, move those folders too.
          old_path = old_package.replace(".", "/")
          new_path = new_package.replace(".", "/")
          for path in sorted(root.rglob("*"), key=lambda p: len(p.parts), reverse=True):
              path_str = str(path)
              if old_path not in path_str:
                  continue
              destination = Path(path_str.replace(old_path, new_path))
              destination.parent.mkdir(parents=True, exist_ok=True)
              if path.exists() and not destination.exists():
                  path.rename(destination)

          final_manifest = manifest.read_text(encoding="utf-8")
          if 'package="com.tinyfish.browser"' not in final_manifest:
              raise SystemExit("TinyFish package ID check failed")
          if 'android:label="TinyFish Browser"' not in final_manifest:
              raise SystemExit("TinyFish app label check failed")
          print(f"Changed package ID from {old_package} to {new_package}")
          print("Changed application label to TinyFish Browser")
          print(f"Updated package literals in {changed} decoded text files")
          PY

      - name: Normalize Android 16 manifest-only attributes for Apktool
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          path = Path("decoded/AndroidManifest.xml")
          source = path.read_text(encoding="utf-8")

          # Preserve original XML namespace prefixes when writing the decoded manifest.
          for prefix, uri in re.findall(r'xmlns(?::([\w.-]+))?="([^"]+)"', source):
              ET.register_namespace(prefix or "", uri)

          root = ET.fromstring(source)
          android_ns = "{http://schemas.android.com/apk/res/android}"
          removed = {"zygotePreloadNativeLib": 0, "nativeService": 0}
          for element in root.iter():
              for key in list(element.attrib):
                  for name in removed:
                      if key == android_ns + name:
                          del element.attrib[key]
                          removed[name] += 1

          print("Removed unsupported Android manifest attributes:", removed)
          if not removed["zygotePreloadNativeLib"] or not removed["nativeService"]:
              raise SystemExit("Expected unsupported attributes were not found; refusing to rebuild")
          path.write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n' +
              ET.tostring(root, encoding="unicode", short_empty_elements=True),
              encoding="utf-8",
          )
          PY

      - name: Merge TinyFish agent-control service into browser APK
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx2g -jar apktool.jar d -f tinyfish-bridge/app/build/outputs/apk/debug/app-debug.apk -o bridge-decoded
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import re
          import xml.etree.ElementTree as ET

          decoded = Path("decoded")
          bridge = Path("bridge-decoded")
          class_dirs = []
          for smali_root in bridge.glob("smali*"):
              candidate = smali_root / "com/tinyfish/browser/bridge"
              if candidate.is_dir():
                  class_dirs.append(candidate)
          if not class_dirs:
              raise SystemExit("Bridge classes not found in built helper APK")

          existing = []
          for path in decoded.glob("smali_classes*"):
              match = re.fullmatch(r"smali_classes(\\d+)", path.name)
              if match:
                  existing.append(int(match.group(1)))
          dex_number = max(existing, default=1) + 1
          dest = decoded / f"smali_classes{dex_number}" / "com/tinyfish/browser/bridge"
          dest.mkdir(parents=True, exist_ok=True)
          class_count = 0
          for src in class_dirs:
              for item in src.iterdir():
                  target = dest / item.name
                  if item.is_dir():
                      shutil.copytree(item, target, dirs_exist_ok=True)
                  else:
                      shutil.copy2(item, target)
                  class_count += 1
          if class_count < 2:
              raise SystemExit("Expected TinyFish activity and Accessibility service classes")

          config_src = Path("tinyfish-bridge/app/src/main/res/xml/tinyfish_accessibility_config.xml")
          config_dest = decoded / "res/xml/tinyfish_accessibility_config.xml"
          config_dest.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(config_src, config_dest)

          manifest = decoded / "AndroidManifest.xml"
          source = manifest.read_text(encoding="utf-8")
          for prefix, uri in re.findall(r'xmlns(?::([\\w.-]+))?="([^"]+)"', source):
              ET.register_namespace(prefix or "", uri)
          tree = ET.ElementTree(ET.fromstring(source))
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"

          if not any(e.tag in ("uses-permission", "uses-permission-sdk-23")
                     and e.get(android + "name") == "android.permission.INTERNET" for e in root):
              root.insert(0, ET.Element("uses-permission", {android + "name": "android.permission.INTERNET"}))

          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest.xml has no application element")

          activity_name = "com.tinyfish.browser.bridge.MainActivity"
          service_name = "com.tinyfish.browser.bridge.TinyFishAccessibilityService"
          activities = [e for e in app.findall("activity") if e.get(android + "name") == activity_name]
          if not activities:
              activity = ET.SubElement(app, "activity", {
                  android + "name": activity_name,
                  android + "exported": "true",
                  android + "label": "TinyFish Control",
                  android + "theme": "@android:style/Theme.Material.Light.NoActionBar"
              })
              filt = ET.SubElement(activity, "intent-filter")
              ET.SubElement(filt, "action", {android + "name": "android.intent.action.MAIN"})
              ET.SubElement(filt, "category", {android + "name": "android.intent.category.LAUNCHER"})

          services = [e for e in app.findall("service") if e.get(android + "name") == service_name]
          if not services:
              service = ET.SubElement(app, "service", {
                  android + "name": service_name,
                  android + "exported": "true",
                  android + "label": "TinyFish Agent Control",
                  android + "permission": "android.permission.BIND_ACCESSIBILITY_SERVICE"
              })
              filt = ET.SubElement(service, "intent-filter")
              ET.SubElement(filt, "action", {android + "name": "android.accessibilityservice.AccessibilityService"})
              ET.SubElement(service, "meta-data", {
                  android + "name": "android.accessibilityservice",
                  android + "resource": "@xml/tinyfish_accessibility_config"
              })

          manifest.write_text('<?xml version="1.0" encoding="utf-8"?>\\n' +
                              ET.tostring(root, encoding="unicode", short_empty_elements=True),
                              encoding="utf-8")

          check = ET.parse(manifest).getroot()
          app = check.find("application")
          names = {e.get(android + "name") for tag in ("activity", "service") for e in app.findall(tag)}
          if activity_name not in names or service_name not in names:
              raise SystemExit("Control components missing after manifest merge")
          if not config_dest.is_file():
              raise SystemExit("Accessibility service configuration missing")
          print(f"Added {class_count} bridge class files under {dest.parent.parent}")
          print("Merged launcher activity and authenticated Accessibility API service")
          PY

      - name: Rebuild APK
        shell: bash
        run: java -Xmx8g -jar apktool.jar b decoded -o TinyFish-Browser-unsigned.apk

      - name: Align and sign APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -p -f 4 TinyFish-Browser-unsigned.apk TinyFish-Browser-aligned.apk
          PASS="tinyfish-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-local"
          keytool -genkeypair -v \
            -keystore tinyfish-build-key.jks \
            -alias tinyfish \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=TinyFish Browser, OU=Local Build, O=TinyFish, C=IN' \
            -storepass "$PASS" -keypass "$PASS"
          "$BT/apksigner" sign \
            --ks tinyfish-build-key.jks \
            --ks-key-alias tinyfish \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --out TinyFish-Browser-arm64.apk \
            TinyFish-Browser-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs TinyFish-Browser-arm64.apk
          "$BT/aapt" dump badging TinyFish-Browser-arm64.apk | grep -E "^package:|^application-label:"
          echo "APK_SHA256=$(sha256sum TinyFish-Browser-arm64.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "APK_SIZE_BYTES=$(stat -c%s TinyFish-Browser-arm64.apk)" >> "$GITHUB_ENV"

      - name: Write build information
        shell: bash
        run: |
          cat > TinyFish-Browser-build-info.txt <<EOF
          App label: TinyFish Browser
          Android package: com.tinyfish.browser
          Architecture: Android ARM64 (arm64-v8a)
          Engine/base: Cromite v153.0.8010.37 (Chromium 153)
          Source APK: https://github.com/uazo/cromite/releases/tag/v153.0.8010.37-11507ac1061b5ea227806f5e84db5a57df6ccf6a
          Source APK SHA-256: $CROMITE_APK_SHA256
          Output APK SHA-256: $APK_SHA256
          Output size (bytes): $APK_SIZE_BYTES
          Signing: temporary self-signed test certificate generated for this run
          TinyFish control: authenticated Accessibility-based API on 127.0.0.1:8765
          API endpoints: GET /v1/health, GET /v1/snapshot, GET /v1/openapi, POST /v1/navigate, POST /v1/action
          Security: API requires generated bearer token and binds to loopback only; user must enable TinyFish Agent Control in Accessibility Settings
          Note: this is a post-processed Chromium-based APK, not a from-source Chromium compilation.
          EOF

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TinyFish-Browser-Android-ARM64
          path: |
            TinyFish-Browser-arm64.apk
            TinyFish-Browser-build-info.txt
            tinyfish-bridge/README.md
          if-no-files-found: error
          retention-days: 30
